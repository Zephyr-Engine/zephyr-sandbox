name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # build.zig.zon deliberately uses sibling checkouts during development.
      # Recreate that layout on each hosted runner.
      - name: Checkout zephyr-runtime
        shell: bash
        run: git clone --depth 1 https://github.com/Zephyr-Engine/zephyr-runtime.git ../zephyr-runtime

      - name: Build project
        shell: bash
        run: zig build check

      - name: Run tests
        shell: bash
        run: zig build test --summary all
